name: Update AR Poll

on:
  schedule:
    - cron: "0 13 * * 0"   # Sundays 8:00 AM Central: results from Saturday
    - cron: "0 13 * * 3"   # Wednesdays 8:00 AM Central: new lines for the week
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-site        # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"   # no __pycache__ files in the repo
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                  # always the latest version, even on a re-run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r engine/requirements.txt
      - name: Download games and lines
        working-directory: engine
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python fetch_cfbd.py
      - name: Rebuild site
        working-directory: engine
        run: python build_site.py
      - name: Publish
        run: |
          git config user.name "AR Poll bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf engine/__pycache__
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Weekly AR Poll update"
          git pull --rebase -X theirs origin main   # pick up anything uploaded during the run
          git push
